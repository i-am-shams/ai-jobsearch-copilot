# Also demo-only. The real deployment's RabbitMQ lives on the VPS, shared
# with the API and worker - this is a throwaway broker just so the
# notifications Deployment below has something real to bind a queue to
# inside this cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: jobcopilot-notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: jobcopilot
            - name: RABBITMQ_DEFAULT_PASS
              value: devpassword
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: jobcopilot-notifications
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
