server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the API container by its Docker Compose service name ("api") -
    # resolves via Docker's internal DNS, only reachable within the compose
    # network. This means the frontend is self-contained: whatever host
    # actually serves this container (local docker-compose, or the VPS), the
    # frontend only ever needs ONE thing proxied to it - it handles routing
    # to the API/SignalR hub internally, rather than requiring the outer
    # reverse proxy (e.g. the VPS's own nginx) to know about /api or /hubs.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR needs WebSocket upgrade headers specifically - a plain proxy_pass
    # would only support the (slower) long-polling fallback transport.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints, proxied so an external uptime monitor can reach them
    # over the public domain. Exact-match (=) so they take precedence over the
    # SPA fallback below. The outer VPS nginx already proxies "/" to this
    # container, so exposing these needs NO change to the shared nginx config
    # that also serves the co-hosted project.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
