name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore api/JobCopilot.Api/JobCopilot.Api.csproj
      - name: Build API
        run: dotnet build api/JobCopilot.Api/JobCopilot.Api.csproj --no-restore --configuration Release
      - name: Build Worker
        run: dotnet build worker/JobCopilot.Worker/JobCopilot.Worker.csproj --configuration Release
      - name: Test
        run: dotnet test api/JobCopilot.Api.Tests/JobCopilot.Api.Tests.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type check and build
        run: npm run build
        working-directory: frontend
