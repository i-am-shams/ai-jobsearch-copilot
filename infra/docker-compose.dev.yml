services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobcopilot
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobcopilot
    ports:
        - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP protocol port — app connects here
      - "15672:15672"  # management UI — browse to http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: jobcopilot
      RABBITMQ_DEFAULT_PASS: devpassword

  # Local dev only. Production uses MongoDB Atlas's free tier (Project 2 -
  # own polyglot database for the notifications service, kept separate from
  # the API/worker's Postgres) - no local credentials needed here since this
  # container isn't exposed to anything but the notifications service itself.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: