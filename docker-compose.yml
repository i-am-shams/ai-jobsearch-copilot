services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobcopilot
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobcopilot
    # No published ports: only the api/worker containers need to reach this,
    # over the internal Docker Compose network by service name ("postgres").
    # Publishing to the host would needlessly expose the database beyond
    # what's actually required - a real hardening step, not just tidiness.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    # Same reasoning as postgres above - no published ports.
    environment:
      RABBITMQ_DEFAULT_USER: jobcopilot
      RABBITMQ_DEFAULT_PASS: devpassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/JobCopilot.Api/Dockerfile
    ports:
      # Loopback-only: the frontend container reaches this internally via
      # the "api" service name, and on a VPS the host's own reverse proxy
      # reaches it via 127.0.0.1. Never bound to 0.0.0.0 - there's no
      # legitimate reason for this port to be reachable from outside the
      # host at all, bypassing TLS/the reverse proxy entirely.
      - "127.0.0.1:5220:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=jobcopilot;Username=jobcopilot;Password=devpassword"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: jobcopilot
      RabbitMq__Password: devpassword
      Jwt__Key: "a-long-random-secret-min-32-chars-change-later"
      Jwt__Issuer: "JobCopilotApi"
      Jwt__Audience: "JobCopilotClient"
      Jwt__ExpiryMinutes: "60"
    # Hits the LIVENESS endpoint, not readiness: Docker restarts containers that
    # fail this, and killing a healthy API because Postgres blipped for 20s would
    # turn a recoverable dependency hiccup into an outage of its own.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/JobCopilot.Worker/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=jobcopilot;Username=jobcopilot;Password=devpassword"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: jobcopilot
      RabbitMq__Password: devpassword
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Worker__HeartbeatFile: /tmp/worker-heartbeat
    # The worker has no HTTP surface, so liveness is "has it written a fresh
    # heartbeat recently?" - and it only writes one while its RabbitMQ
    # connection is genuinely open (see Worker.RunHeartbeatLoopAsync). The $$
    # escaping is required: a single $ would be swallowed by Compose's own
    # variable interpolation before the shell ever sees it.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Project 2: an independent service on its own database (MongoDB, not
  # Postgres - the polyglot-persistence piece), talking to the rest of the
  # stack only over the fanout exchange the worker publishes
  # MatchCompletedEvent to (see Worker.cs's PublishCompleted and
  # notifications/src/rabbitmq.ts). No direct dependency on the API or
  # worker's code or database at all - that's what "independent" means here.
  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: jobcopilot
      RABBITMQ_PASSWORD: devpassword
      # Points at MongoDB Atlas's free tier in every real environment (local
      # full-stack included) - there is no Postgres-style "just run it in
      # this compose file with no published port" option for the DB this
      # service owns, by design: it's the one piece meant to demonstrate an
      # actual managed-cloud service, not a container playing the part of
      # one.
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: jobcopilot_notifications
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Loopback-only, same reasoning as api above.
      - "127.0.0.1:5173:80"
    # nginx:alpine has busybox wget (but no curl), unlike the aspnet image.
    # 127.0.0.1 rather than "localhost" is deliberate and was found the hard
    # way: nginx here listens on 0.0.0.0:80 (IPv4 only), but "localhost"
    # resolves to ::1 first inside the container, so busybox wget got a flat
    # connection-refused and the container sat permanently unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Upgraded from a plain depends_on: the frontend proxies /api and /hubs to
    # the API, so starting it before the API can serve requests just produces
    # 502s for anyone quick enough to load the page.
    depends_on:
      api:
        condition: service_healthy

  # Observability leg of Project 2: ships this stack's metrics (host + every
  # container) and logs (every container's stdout/stderr) to Grafana Cloud.
  # Independent of the app - nothing here is a dependency of anything else,
  # so it can fail without affecting the actual product.
  alloy:
    image: grafana/alloy:latest
    command:
      - run
      # 0.0.0.0 here is safe: the host-side port mapping below is still
      # loopback-only. Binding to 127.0.0.1 here would mean "loopback of
      # the container's own network namespace" - unreachable through the
      # port mapping from the host at all (same class of bug as the
      # frontend nginx/wget mismatch documented in docs/HANDOVER.md).
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket: needed by both cAdvisor (per-container
      # metrics) and the Docker log/discovery components. Same trust
      # boundary the deploy VPS user already sits in (docker group =
      # root-equivalent), not a new privilege being introduced.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host metrics: bind-mounted read-only, paths matched to config.alloy's
      # procfs_path/sysfs_path/rootfs_path.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    environment:
      GRAFANA_CLOUD_METRICS_URL: ${GRAFANA_CLOUD_METRICS_URL}
      GRAFANA_CLOUD_METRICS_USER: ${GRAFANA_CLOUD_METRICS_USER}
      GRAFANA_CLOUD_LOGS_URL: ${GRAFANA_CLOUD_LOGS_URL}
      GRAFANA_CLOUD_LOGS_USER: ${GRAFANA_CLOUD_LOGS_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    # No healthcheck: the official image ships no curl/wget (open upstream
    # issue), so a CMD-based check can't be written honestly. deploy.sh's
    # wait_for_healthy() already treats a container with no healthcheck as a
    # non-fatal warning, so this doesn't block deploys on the other services.

volumes:
  pgdata:
